<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Светлячки и карты</title>
<style>
:root{--bg:#120f2a;--pan:#1f1940;--ink:#f3e9d8;--amb:#f2b84b;--red:#c4414b;--line:rgba(243,233,216,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Iowan Old Style",serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;max-width:560px;margin:0 auto}
header b.t{font-style:italic;font-weight:400;font-size:22px}
nav{display:flex;gap:8px;padding:0 16px;max-width:560px;margin:0 auto}
main{padding:12px 16px 40px;max-width:560px;margin:0 auto}
button{font:inherit;color:var(--ink);background:var(--pan);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;margin:2px 4px 2px 0}
button[aria-pressed=true],.pri{background:var(--amb);color:#201a3a;border-color:var(--amb)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;margin:6px 0;min-height:70px;align-items:flex-start}
.cd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:66px;border-radius:7px;background:#f6efe0;color:#22203a;font-weight:700;font-size:17px;line-height:1.1;border:0;padding:0;margin:2px}
.cd.r{color:var(--red)}
.cd.back{background:repeating-linear-gradient(45deg,#3b2f7a,#3b2f7a 4px,#2a2158 4px,#2a2158 8px)}
.cd:disabled{opacity:.4;cursor:default}
.pr{display:inline-flex;margin:0 10px 18px 2px}
.pr .cd+.cd{margin-left:-28px;margin-top:16px}
.note{opacity:.85;margin:6px 0}
.cnt{font-size:22px;font-style:italic}
canvas{width:100%;height:340px;border-radius:14px;background:#0e0b20;touch-action:none;display:block;margin:8px 0}
</style>
</head>
<body>
<header><b class="t">Светлячки и карты</b><span>🪙 <b id="co"></b></span></header>
<nav>
<button data-t="d" aria-pressed="true" onclick="go('d')">Дурак</button>
<button data-t="p" aria-pressed="false" onclick="go('p')">Покер</button>
<button data-t="f" aria-pressed="false" onclick="go('f')">Светлячки</button>
</nav>
<main id="v"></main>
<script>
const $=id=>document.getElementById(id);
let coins=500,tab='d';
try{const s=localStorage.getItem('fc');if(s!==null)coins=+s||0}catch(e){}
function pay(n){coins+=n;try{localStorage.setItem('fc',coins)}catch(e){}$('co').textContent=coins}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rm=(h,c)=>h.splice(h.indexOf(c),1);
const cardH=(l,s,on,dis)=>`<button class="cd ${s==1||s==2?'r':''}" ${dis?'disabled':''} ${on?`onclick="${on}"`:''}>${l}<span>${'♠♥♦♣'[s]}</span></button>`;
const back=n=>'<span class="cd back"></span>'.repeat(n);
const brokeH=()=>coins<20?`<p class="note">Монеты кончились. Поймай 20 из 20 светлячков и получи 300 🪙.</p><button class="pri" onclick="go('f')">К светлячкам</button>`:'';
function go(t){fly.id++;tab=t;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t==t));t=='d'?dView():t=='p'?kView():fView()}

/* ---------- Дурак ---------- */
const RK=['6','7','8','9','10','В','Д','К','Т'];
let D=null;
const beats=(d,a)=>d.s==a.s?d.r>a.r:d.s==D.ts;
const open=()=>D.t.filter(x=>!x.d);
const rks=()=>new Set(D.t.flatMap(x=>x.d?[x.a.r,x.d.r]:[x.a.r]));
const canAdd=c=>D.t.length<D.cap&&(!D.t.length||rks().has(c.r));
const w=c=>(c.s==D.ts)*20+c.r;
const low=a=>a.slice().sort((x,y)=>w(x)-w(y))[0];
const pile=()=>D.t.flatMap(y=>y.d?[y.a,y.d]:[y.a]);
function dNew(){
 if(coins<20)return;pay(-20);
 const dk=[];for(let s=0;s<4;s++)for(let r=0;r<9;r++)dk.push({s,r});shuf(dk);
 const p=[],b=[];for(let i=0;i<6;i++){p.push(dk.pop());b.push(dk.pop())}
 D={dk,ts:dk[0].s,p,b,t:[],att:'p',msg:'',end:0,cap:0};
 const lo=h=>Math.min(99,...h.filter(c=>c.s==D.ts).map(c=>c.r)),lp=lo(p),lb=lo(b);
 D.att=lp<lb?'p':lb<lp?'b':(Math.random()<.5?'p':'b');
 if(D.att=='b')bAtt();
 dView();
}
function fin(r){D.end=1;D.res=r;pay(r==1?40:r==.5?20:0)}
function endR(tk){
 D.t=[];
 const a=D.att=='p'?D.p:D.b,d=D.att=='p'?D.b:D.p;
 for(const h of[a,d])while(h.length<6&&D.dk.length)h.push(D.dk.pop());
 if(!tk)D.att=D.att=='p'?'b':'p';
 if(!D.dk.length){
  if(!D.p.length&&!D.b.length)return fin(.5);
  if(!D.p.length)return fin(1);
  if(!D.b.length)return fin(0);
 }
 if(D.att=='b')bAtt();
}
function bDef(){
 const x=open()[0],bs=D.b.filter(c=>beats(c,x.a));
 if(!bs.length){D.b.push(...pile());D.msg='Бот взял карты.';endR(1)}
 else{x.d=low(bs);rm(D.b,x.d);D.msg=''}
}
function bAtt(){
 if(!D.t.length){D.cap=Math.min(6,D.p.length);const c=low(D.b);rm(D.b,c);D.t.push({a:c});D.msg='';return}
 const cs=D.b.filter(c=>canAdd(c)&&(c.s!=D.ts||!D.dk.length));
 if(cs.length){const c=low(cs);rm(D.b,c);D.t.push({a:c});D.msg=''}
 else{D.msg='Бот: бито.';endR(0)}
}
function dp(i){
 const c=D.p[i];
 if(D.att=='p'){
  if(!canAdd(c))return;
  if(!D.t.length)D.cap=Math.min(6,D.b.length);
  rm(D.p,c);D.t.push({a:c});bDef();
 }else{
  const x=open()[0];if(!x||!beats(c,x.a))return;
  rm(D.p,c);x.d=c;if(!open().length)bAtt();
 }
 dView();
}
function dDone(){if(D.att!='p'||!D.t.length||open().length)return;D.msg='Бито.';endR(0);dView()}
function dTake(){if(!open().length)return;D.p.push(...pile());D.msg='Ты взял карты.';endR(1);dView()}
function dView(){
 const v=$('v');
 if(!D){v.innerHTML=`<p class="note">Дурак против бота. Ставка 20 🪙, победа возвращает 40, ничья 20.</p>${brokeH()||'<button class="pri" onclick="dNew()">Играть</button>'}`;return}
 D.p.sort((x,y)=>w(x)-w(y));
 const o=open()[0],pa=D.att=='p';
 const ok=c=>!D.end&&(pa?canAdd(c):o&&beats(c,o.a));
 const st=D.end?(D.res==1?'Ты выиграл! Бот остался дураком. +40 🪙':D.res==.5?'Ничья. Ставка вернулась.':'Ты остался дураком.'):
  pa?(D.t.length&&!o?'Подкинь карту или нажми «Бито».':'Твой ход: выбери карту для атаки.'):'Бот атакует: отбей карту или возьми.';
 v.innerHTML=`<div class="note">Козырь ${'♠♥♦♣'[D.ts]} · в колоде ${D.dk.length}</div>
 <div class="row">${back(D.b.length)}</div>
 <div class="row" style="min-height:100px">${D.t.map(x=>`<span class="pr">${cardH(RK[x.a.r],x.a.s)}${x.d?cardH(RK[x.d.r],x.d.s):''}</span>`).join('')}</div>
 <div class="note">${D.msg} ${st}</div>
 ${!D.end&&pa&&D.t.length&&!o?'<button class="pri" onclick="dDone()">Бито</button>':''}
 ${!D.end&&!pa&&o?'<button class="pri" onclick="dTake()">Взять</button>':''}
 ${D.end?(coins<20?brokeH():'<button class="pri" onclick="dNew()">Новая партия</button>'):''}
 <div class="row">${D.p.map((c,i)=>cardH(RK[c.r],c.s,`dp(${i})`,!ok(c))).join('')}</div>`;
}

/* ---------- Покер (Техасский холдем, 1 на 1) ---------- */
const PL=r=>({11:'В',12:'Д',13:'К',14:'Т'})[r]||r;
const CN=['старшая карта','пара','две пары','тройка','стрит','флеш','фулл-хаус','каре','стрит-флеш'];
function ev5(c){
 const r=c.map(x=>x.r).sort((a,b)=>b-a),fl=c.every(x=>x.s==c[0].s);
 let st=0;
 if(new Set(r).size==5){if(r[0]-r[4]==4)st=r[0];else if(r[0]==14&&r[1]==5)st=5}
 const n={};r.forEach(x=>n[x]=(n[x]||0)+1);
 const g=Object.entries(n).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
 const cat=st&&fl?8:g[0][0]==4?7:g[0][0]==3&&g[1][0]==2?6:fl?5:st?4:g[0][0]==3?3:g[0][0]==2&&g[1][0]==2?2:g[0][0]==2?1:0;
 const t=st?[st]:g.map(x=>x[1]);
 return cat*1e6+t.reduce((a,x,i)=>a+x*Math.pow(15,4-i),0);
}
function evb(h){let b=0;const n=h.length;(function f(i,a){if(a.length==5){b=Math.max(b,ev5(a));return}if(i>=n||a.length+n-i<5)return;f(i+1,a.concat(h[i]));f(i+1,a)})(0,[]);return b}
let K=null;
function kNew(){
 if(coins<20)return;pay(-20);
 const dk=[];for(let s=0;s<4;s++)for(let r=2;r<15;r++)dk.push({s,r});shuf(dk);
 K={dk,h:[dk.pop(),dk.pop()],b:[dk.pop(),dk.pop()],bd:[],pot:40,tc:0,ph:0,end:0,msg:'Префлоп. Твой ход.'};
 kView();
}
function str(){
 let s;
 if(K.bd.length<3){const[a,b]=K.b;s=a.r==b.r?.75:(a.r+b.r)/30+(a.s==b.s?.08:0)}
 else s=[.25,.5,.7,.8,.85,.9,.95,1,1][evb(K.b.concat(K.bd))/1e6|0];
 return s+Math.random()*.25-.1;
}
function kEnd(r,sd){
 K.end=1;K.res=r;K.sd=sd;
 if(r==1)pay(K.pot);else if(r==.5)pay(Math.floor(K.pot/2));
}
function nx(){
 K.tc=0;K.ph++;
 if(K.ph>3){
  const a=evb(K.h.concat(K.bd)),b=evb(K.b.concat(K.bd));
  K.msg=`У тебя: ${CN[a/1e6|0]}. У бота: ${CN[b/1e6|0]}.`;
  return kEnd(a>b?1:a<b?0:.5,1);
 }
 const k=K.ph==1?3:1;for(let i=0;i<k;i++)K.bd.push(K.dk.pop());
 K.msg=['','Флоп.','Тёрн.','Ривер.'][K.ph]+' Твой ход.';
}
function kAct(a){
 if(K.end)return;
 if(a=='f'){K.msg='Ты сбросил карты.';kEnd(0,0)}
 else if(K.tc){const t=Math.min(K.tc,coins);pay(-t);K.pot+=t;nx()}
 else if(a=='c'){if(str()>.8){K.tc=50;K.pot+=50;K.msg='Бот ставит 50. Уравняй или сбрось.'}else nx()}
 else if(a=='r'){
  if(coins<50)return;pay(-50);K.pot+=50;
  if(str()>.55){K.pot+=50;nx()}
  else{K.msg='Бот сбросил карты.';kEnd(1,0)}
 }
 kView();
}
function kView(){
 const v=$('v');
 if(!K){v.innerHTML=`<p class="note">Холдем 1 на 1 против бота. Вход 20 🪙, ставка 50 🪙. Победитель забирает банк.</p>${brokeH()||'<button class="pri" onclick="kNew()">Раздать</button>'}`;return}
 const sl=Array.from({length:5},(_,i)=>K.bd[i]?cardH(PL(K.bd[i].r),K.bd[i].s):'<span class="cd back" style="opacity:.2"></span>').join('');
 const res=K.end?(K.res==1?` Ты выиграл банк ${K.pot} 🪙!`:K.res==.5?' Ничья, банк пополам.':' Банк достался боту.'):'';
 v.innerHTML=`<div class="note">Банк: ${K.pot} 🪙</div>
 <div class="row">${K.sd?K.b.map(c=>cardH(PL(c.r),c.s,'',1)).join(''):back(2)}</div>
 <div class="row">${sl}</div>
 <div class="note">${K.msg}${res}</div>
 <div class="row">${K.h.map(c=>cardH(PL(c.r),c.s)).join('')}</div>
 ${K.end?(coins<20?brokeH():'<button class="pri" onclick="kNew()">Новая раздача</button>'):
  K.tc?`<button class="pri" onclick="kAct('c')">Уравнять ${K.tc}</button><button onclick="kAct('f')">Сбросить</button>`:
  `<button class="pri" onclick="kAct('c')">Чек</button><button ${coins<50?'disabled':''} onclick="kAct('r')">Ставка 50</button>`}`;
}

/* ---------- Светлячки ---------- */
const fly={id:0};
function fView(){
 $('v').innerHTML=`<p class="note">${coins<20?'Монеты кончились. Поймай всех 20 светлячков, и получишь 300 🪙.':'Тренировка: поймай 20 из 20. Награда даётся, только когда монет не осталось.'}</p>
 <div class="cnt" id="n">0 / 20</div><canvas id="fc"></canvas><button onclick="fStart()">Начать заново</button>`;
 fStart();
}
function fStart(){
 const id=++fly.id,cv=$('fc'),x=cv.getContext('2d'),W=cv.width=cv.clientWidth,H=cv.height=340,rew=coins<20;
 let got=0;
 const fl=Array.from({length:20},()=>({x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.28,v:1.2+Math.random()*1.2,p:Math.random()*6}));
 $('n').textContent='0 / 20';
 cv.onpointerdown=e=>{
  const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;
  let bi=-1,bd=40;
  fl.forEach((f,i)=>{const d=Math.hypot(f.x-px,f.y-py);if(d<bd){bd=d;bi=i}});
  if(bi<0)return;
  fl.splice(bi,1);got++;
  $('n').textContent=got+' / 20';
  if(got==20){fly.id++;$('n').textContent=rew?'20 / 20 ✨ +300 🪙':'20 / 20 ✨ Отлично!';if(rew){pay(300)}x.clearRect(0,0,W,H)}
 };
 (function loop(t){
  if(fly.id!=id)return;
  x.globalCompositeOperation='source-over';x.fillStyle='rgba(14,11,32,.3)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  for(const f of fl){
   f.a+=(Math.random()-.5)*.5;const s=f.v*(1+got*.06);
   f.x+=Math.cos(f.a)*s;f.y+=Math.sin(f.a)*s;
   if(f.x<8||f.x>W-8){f.a=Math.PI-f.a;f.x=Math.max(8,Math.min(W-8,f.x))}
   if(f.y<8||f.y>H-8){f.a=-f.a;f.y=Math.max(8,Math.min(H-8,f.y))}
   const g=.5+.5*Math.sin(t/300+f.p),r=10+g*8,gr=x.createRadialGradient(f.x,f.y,0,f.x,f.y,r*2);
   gr.addColorStop(0,`hsla(45,95%,70%,${.5+g*.5})`);gr.addColorStop(1,'hsla(45,95%,60%,0)');
   x.fillStyle=gr;x.beginPath();x.arc(f.x,f.y,r*2,0,6.283);x.fill();
  }
  requestAnimationFrame(loop);
 })(0);
}
pay(0);dView();
</script>
</body>
</html>
